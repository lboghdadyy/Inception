events {
	
}

http {
	server {
		listen				443 ssl;
		server_name			sbaghdad.42.fr;
		ssl_protocols		TLSv1.2 TLSv1.3;
		ssl_certificate		/etc/nginx/certificate/inception_certif.crt;
		ssl_certificate_key	/etc/nginx/certificate/inception_private_key.key;
		root /var/www/html;
		index index.php index.html;
		location ~ \.php {
			fastcgi_pass 	wordpress:9000;
			include 		fastcgi_params;
			fastcgi_param	SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}
		location \ {
			try_files $uri $uri/ /index.php?$args;
		}
	}
}
