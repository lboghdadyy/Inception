services:
  mariadb :
    build : ./requirements/mariadb
    networks :
      - mariadb-wordpress
    secrets :
      - mySqlPassword
      - mySqlRootPassword
    volumes :
      - mariadb-db:/var/lib/mysql
    env_file : .env
  wordpress :
    build : ./requirements/wordpress
    networks :
      - mariadb-wordpress
      - wordpress-nginx
    secrets :
      - mySqlPassword
      - wp-AdminPassword
      - wp-UserPassword
    volumes :
      - wordpress-data:/var/www/html
    env_file : .env
  nginx :
    build : ./requirements/nginx
    networks :
      - wordpress-nginx
    volumes :
      - wordpress-data:/var/www/html
    ports : 
      - "443:443"
networks:
  mariadb-wordpress :
    driver : bridge
  wordpress-nginx :
    driver : bridge
secrets:
  mySqlPassword:
    file : ./secrets/mySqlPassword.txt
  mySqlRootPassword:
    file : ./secrets/mySqlRootPassword.txt
  wp-AdminPassword :
    file : ./secrets/wp-AdminPassword.txt
  wp-UserPassword :
    file : ./secrets/wp-UserPassword.txt
volumes:
  wordpress-data :
  mariadb-db :